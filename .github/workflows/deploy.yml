name: Build & deploy to GitHub Pages

# Generates the static site from the Pages CMS content (content/, assets/)
# and deploys it to GitHub Pages on the videoludique.ca custom domain.
# All former WordPress posts and images now live in this repository.

on:
  push:
    branches: [ main, claude/videoludique-wordpress-migration-rrwn74 ]
  workflow_dispatch:      # run manually from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate static site
        run: python3 build.py

      - name: Assemble _site
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='.git' --exclude='.github' --exclude='_source' \
            --exclude='__pycache__' --exclude='*.py' --exclude='scripts' \
            --exclude='README.md' --exclude='_site' \
            --exclude='content' --exclude='.pages.yml' \
            ./ _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
